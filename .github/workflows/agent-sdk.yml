name: Agent SDK artifacts

on:
  pull_request:
    paths:
      - "agent-sdk/**"
      - "backend/tests/test_agent_sdk_workflow_contracts.py"
      - ".github/workflows/agent-sdk.yml"
  push:
    branches: [main]
    tags: ["agent-sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NOTEMELD_SDK_VERSION: "0.1.0"
  NOTEMELD_SCHEMA_VERSION: "1"
  NOTEMELD_BINDING_VERSION: "0.1.0"
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Contract and workspace gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Parse workflow and run artifact contracts
        run: python -m pytest backend/tests/test_agent_sdk_workflow_contracts.py -q
      - name: Compile the shared workspace with cargo build
        run: cargo build --manifest-path agent-sdk/Cargo.toml --workspace --locked
      - name: Run shared workspace tests
        run: cargo test --manifest-path agent-sdk/Cargo.toml --workspace --locked

  build-native:
    name: Native ${{ matrix.target }}
    needs: contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build Python/native artifact
        shell: bash
        run: agent-sdk/scripts/build-python.sh "${{ matrix.target }}"
      - name: Run native Python fake-turn harness when host matches target
        shell: bash
        run: |
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$HOST_TARGET" == "${{ matrix.target }}" ]]; then
            case "${{ matrix.target }}" in
              *-pc-windows-*) LIBRARY="notemeld_agent.dll" ;;
              *-apple-darwin) LIBRARY="libnotemeld_agent.dylib" ;;
              *) LIBRARY="libnotemeld_agent.so" ;;
            esac
            NOTEMELD_AGENT_SDK_LIBRARY="$PWD/agent-sdk/target/${{ matrix.target }}/release/$LIBRARY" \
              PYTHONPATH=agent-sdk/bindings/python \
              python -m pytest agent-sdk/examples/python-host/test_smoke.py -q
          else
            echo "${{ matrix.target }} was cross-built; no target process is available on $HOST_TARGET"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-sdk-${{ matrix.target }}
          path: agent-sdk/dist/${{ matrix.target }}/
          if-no-files-found: error

  build-swift:
    name: iOS device and simulator
    needs: contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build iOS slices, compile Swift wrapper, and xcodebuild XCFramework
        run: agent-sdk/scripts/build-swift.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-sdk-ios
          path: |
            agent-sdk/dist/aarch64-apple-ios/
            agent-sdk/dist/aarch64-apple-ios-sim/
          if-no-files-found: error

  build-android:
    name: Android four-ABI AAR and x86_64 instrumentation
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4
      - name: Install pinned Android SDK, build tools, CMake, and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Build Android ABI set and assembleRelease AAR
        run: agent-sdk/scripts/build-kotlin.sh
      - name: Run x86_64 connectedAndroidTest fake-turn harness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: NOTEMELD_AGENT_LIBRARY_DIR="$GITHUB_WORKSPACE/agent-sdk/target/android-jni" gradle -p agent-sdk/examples/android-harness --no-daemon connectedAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: agent-sdk-android
          path: |
            agent-sdk/dist/aarch64-linux-android/
            agent-sdk/dist/armv7-linux-androideabi/
            agent-sdk/dist/i686-linux-android/
            agent-sdk/dist/x86_64-linux-android/
          if-no-files-found: error

  build-harmony:
    name: OpenHarmony ARM64 HAR
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OPENHARMONY_SDK_URL: ${{ vars.OPENHARMONY_SDK_URL }}
      OPENHARMONY_COMMANDLINE_TOOLS_URL: ${{ vars.OPENHARMONY_COMMANDLINE_TOOLS_URL }}
      OPENHARMONY_SDK_SHA256: ${{ vars.OPENHARMONY_SDK_SHA256 }}
      OPENHARMONY_COMMANDLINE_TOOLS_SHA256: ${{ vars.OPENHARMONY_COMMANDLINE_TOOLS_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-unknown-linux-ohos
      - name: Install the repository-pinned official OpenHarmony SDK and command-line tools
        shell: bash
        run: |
          if [[ -z "$OPENHARMONY_SDK_URL" || -z "$OPENHARMONY_COMMANDLINE_TOOLS_URL" || -z "$OPENHARMONY_SDK_SHA256" || -z "$OPENHARMONY_COMMANDLINE_TOOLS_SHA256" ]]; then
            echo "Set OpenHarmony archive URL and SHA256 repository variables to pinned official releases" >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/ohos-sdk" "$RUNNER_TEMP/ohos-tools"
          curl --fail --location --retry 3 "$OPENHARMONY_SDK_URL" --output "$RUNNER_TEMP/ohos-sdk.zip"
          curl --fail --location --retry 3 "$OPENHARMONY_COMMANDLINE_TOOLS_URL" --output "$RUNNER_TEMP/ohos-tools.zip"
          echo "$OPENHARMONY_SDK_SHA256  $RUNNER_TEMP/ohos-sdk.zip" | sha256sum --check --strict
          echo "$OPENHARMONY_COMMANDLINE_TOOLS_SHA256  $RUNNER_TEMP/ohos-tools.zip" | sha256sum --check --strict
          if unzip -tq "$RUNNER_TEMP/ohos-sdk.zip" >/dev/null; then
            unzip -q "$RUNNER_TEMP/ohos-sdk.zip" -d "$RUNNER_TEMP/ohos-sdk"
          elif tar -tf "$RUNNER_TEMP/ohos-sdk.zip" >/dev/null; then
            tar -xf "$RUNNER_TEMP/ohos-sdk.zip" -C "$RUNNER_TEMP/ohos-sdk"
          else
            echo "Unsupported OpenHarmony SDK archive format" >&2
            exit 3
          fi
          if unzip -tq "$RUNNER_TEMP/ohos-tools.zip" >/dev/null; then
            unzip -q "$RUNNER_TEMP/ohos-tools.zip" -d "$RUNNER_TEMP/ohos-tools"
          elif tar -tf "$RUNNER_TEMP/ohos-tools.zip" >/dev/null; then
            tar -xf "$RUNNER_TEMP/ohos-tools.zip" -C "$RUNNER_TEMP/ohos-tools"
          else
            echo "Unsupported OpenHarmony command-line tools archive format" >&2
            exit 3
          fi
          while IFS= read -r NATIVE_ARCHIVE; do
            unzip -q "$NATIVE_ARCHIVE" -d "$(dirname "$NATIVE_ARCHIVE")"
          done < <(find "$RUNNER_TEMP/ohos-sdk" -type f -name 'native-*.zip' -print)
          LLVM_DIR="$(find "$RUNNER_TEMP/ohos-sdk" -type d -path '*/native/llvm' -print -quit)"
          NATIVE_DIR="${LLVM_DIR%/llvm}"
          OHPM_PATH="$(find "$RUNNER_TEMP/ohos-tools" -type f -name ohpm -print -quit)"
          HVIGOR_PATH="$(find "$RUNNER_TEMP/ohos-tools" -type f \( -name hvigorw -o -name hvigor \) -print -quit)"
          if [[ -z "$NATIVE_DIR" || -z "$OHPM_PATH" || -z "$HVIGOR_PATH" ]]; then
            echo "Downloaded OpenHarmony archives do not contain native SDK, ohpm, and hvigor" >&2
            exit 4
          fi
          chmod +x "$NATIVE_DIR/llvm/bin/clang" "$NATIVE_DIR/llvm/bin/llvm-ar" "$OHPM_PATH" "$HVIGOR_PATH"
          echo "OHOS_SDK_NATIVE=$NATIVE_DIR" >> "$GITHUB_ENV"
          echo "OHPM_BIN=$OHPM_PATH" >> "$GITHUB_ENV"
          echo "HVIGOR_BIN=$HVIGOR_PATH" >> "$GITHUB_ENV"
      - name: cargo build OpenHarmony target and hvigor assembleHar
        run: agent-sdk/scripts/build-harmony.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-sdk-aarch64-unknown-linux-ohos
          path: agent-sdk/dist/aarch64-unknown-linux-ohos/
          if-no-files-found: error

  verify-manifests:
    name: Verify complete artifact manifest set
    needs: [build-native, build-swift, build-android, build-harmony]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-agent-sdk-artifacts
      - name: Verify checksums, versions, paths, duplicates, and target coverage
        run: |
          python agent-sdk/scripts/verify-artifact-manifest.py verify \
            --artifact-root downloaded-agent-sdk-artifacts \
            --sdk-version "0.1.0" \
            --schema-version "1" \
            --binding-version "0.1.0" \
            --expected-target x86_64-apple-darwin \
            --expected-target aarch64-apple-darwin \
            --expected-target x86_64-pc-windows-msvc \
            --expected-target x86_64-unknown-linux-gnu \
            --expected-target aarch64-unknown-linux-gnu \
            --expected-target aarch64-apple-ios \
            --expected-target aarch64-apple-ios-sim \
            --expected-target aarch64-linux-android \
            --expected-target armv7-linux-androideabi \
            --expected-target i686-linux-android \
            --expected-target x86_64-linux-android \
            --expected-target aarch64-unknown-linux-ohos
