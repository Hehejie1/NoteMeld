name: Mobile adapters

on:
  push:
    paths:
      - "android/**"
      - "ios/**"
      - "harmony/**"
      - "desktop/frontend/tests/mobilePlatformAdapterContracts.test.mjs"
      - ".github/workflows/mobile-adapters.yml"
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "harmony/**"
      - "desktop/frontend/tests/mobilePlatformAdapterContracts.test.mjs"
      - ".github/workflows/mobile-adapters.yml"
  workflow_dispatch:

jobs:
  android:
    name: Android adapter build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Download pinned Agent SDK AAR
        env:
          SDK_AAR_URL: ${{ vars.NOTEMELD_AGENT_SDK_AAR_URL }}
          SDK_AAR_SHA256: ${{ vars.NOTEMELD_AGENT_SDK_AAR_SHA256 }}
        run: |
          set -euo pipefail
          test -n "${SDK_AAR_URL:-}" || { echo "NOTEMELD_AGENT_SDK_AAR_URL is required" >&2; exit 2; }
          test -n "${SDK_AAR_SHA256:-}" || { echo "NOTEMELD_AGENT_SDK_AAR_SHA256 is required" >&2; exit 2; }
          [[ "$SDK_AAR_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "invalid SDK AAR SHA-256" >&2; exit 2; }
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/notemeld-agent-sdk.aar" "$SDK_AAR_URL"
          echo "$SDK_AAR_SHA256  $RUNNER_TEMP/notemeld-agent-sdk.aar" | sha256sum -c -
      - name: Assemble Android debug adapter
        working-directory: android
        env:
          NOTEMELD_AGENT_SDK_AAR: ${{ runner.temp }}/notemeld-agent-sdk.aar
          NOTEMELD_AGENT_SDK_AAR_SHA256: ${{ vars.NOTEMELD_AGENT_SDK_AAR_SHA256 }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Install and launch Android adapter in API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.notemeld.mobile
            adb logcat -c
            adb shell am start -n com.notemeld.mobile/.MainActivity
            sleep 5
            adb logcat -d -t 800 > android-runtime.log
            grep -Eqi 'FATAL EXCEPTION|AndroidRuntime.*(crash|fatal)' android-runtime.log && { cat android-runtime.log; exit 1; } || true
            adb shell dumpsys activity activities | grep -q 'com.notemeld.mobile/.MainActivity'

  ios:
    name: iOS adapter build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator adapter
        run: >-
          xcodebuild
          -project ios/NoteMeldMobile.xcodeproj
          -scheme NoteMeldMobile
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath ios/build/ci
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install and launch iOS Simulator adapter
        shell: bash
        run: |
          device_id="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for runtimes in devices.values():
              for device in runtimes:
                  if device.get('isAvailable') and device.get('name') == 'iPhone 15':
                      print(device['udid'])
                      raise SystemExit
          for runtimes in devices.values():
              for device in runtimes:
                  if device.get('isAvailable'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('no available iOS Simulator')
          PY
          )"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          app_path="$(find ios/build/ci -type d -name 'NoteMeldMobile.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch "$device_id" com.notemeld.mobile

  source-contracts:
    name: Native source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run mobile adapter contracts
        working-directory: desktop/frontend
        run: node --test tests/mobilePlatformAdapterContracts.test.mjs
