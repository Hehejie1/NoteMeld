name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build backend sidecar
        run: |
          NOTEMELD_SKIP_PORTABILITY_CHECK=1 \
          NOTEMELD_PYTHON_BIN=backend/.venv/bin/python3 \
          FFMPEG_BIN_PATH=$(dirname "$(which ffmpeg)") \
          ./packaging/scripts/build-backend-macos.sh

      - name: Build desktop app
        working-directory: desktop
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR/dmg"/*.dmg dist/ 2>/dev/null || true
          fi
          cp "$BUNDLE_DIR"/*.app.tar.gz dist/ 2>/dev/null || true
          cp "$BUNDLE_DIR"/*.app.tar.gz.sig dist/ 2>/dev/null || true
          cp "$BUNDLE_DIR"/*.app.tar.gz.sig2 dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg
        shell: pwsh
        run: |
          winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements
          Write-Host "Searching for ffmpeg..."
          $ffmpegExe = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ffmpegExe) {
            $env:PATH = "$($ffmpegExe.Directory.FullName);$env:PATH"
            Write-Host "ffmpeg found at: $($ffmpegExe.Directory.FullName)"
          } else {
            Write-Host "WARNING: ffmpeg not found after installation"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Build backend sidecar
        shell: pwsh
        env:
          NOTEMELD_PYTHON_BIN: backend\.venv\Scripts\python.exe
        run: |
          $ffmpegExe = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($ffmpegExe) {
            $env:FFMPEG_BIN_PATH = Split-Path $ffmpegExe.Source -Parent
            Write-Host "ffmpeg found in PATH at: $($env:FFMPEG_BIN_PATH)"
          } else {
            $ffmpegExe = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ffmpegExe) {
              $env:FFMPEG_BIN_PATH = $ffmpegExe.Directory.FullName
              $env:PATH = "$($ffmpegExe.Directory.FullName);$env:PATH"
              Write-Host "ffmpeg found at: $($env:FFMPEG_BIN_PATH)"
            } else {
              Write-Host "WARNING: ffmpeg not found"
            }
          }
          powershell -ExecutionPolicy Bypass -File .\packaging\scripts\build-backend-windows.ps1

      - name: Build desktop app
        working-directory: desktop
        run: pnpm tauri build

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Path dist -Force
          $bundleDir = "desktop\src-tauri\target\release\bundle"
          if (Test-Path "$bundleDir\msi") {
            Get-ChildItem -Path "$bundleDir\msi" -Filter "*.msi" -Recurse | Copy-Item -Destination dist\
          }
          Get-ChildItem -Path $bundleDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem -Path $bundleDir -Filter "*.msi.zip" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem -Path $bundleDir -Filter "*.msi.zip.sig" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem -Path $bundleDir -Filter "*.app.zip" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem -Path $bundleDir -Filter "*.app.zip.sig" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Write-Host "Collected artifacts:"
          Get-ChildItem -Path dist\ | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/macos-aarch64/* release/ 2>/dev/null || true
          cp artifacts/windows-x86_64/* release/ 2>/dev/null || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.msi
            release/*.exe
            release/*.app.tar.gz
          generate-release-notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
