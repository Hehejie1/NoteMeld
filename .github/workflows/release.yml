name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: desktop/backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build backend sidecar
        run: |
          NOTEMELD_SKIP_PORTABILITY_CHECK=1 \
          NOTEMELD_PYTHON_BIN=desktop/backend/.venv/bin/python3 \
          NOTEMELD_TARGET_ARCH=arm64 \
          FFMPEG_BIN_PATH=$(dirname "$(which ffmpeg)") \
          ./scripts/desktop/packaging/scripts/build-backend-macos.sh

      - name: Build desktop app with signed updater artifact
        working-directory: desktop
        run: pnpm tauri build --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR/dmg"/*.dmg dist/ 2>/dev/null || true
          fi
          find "$BUNDLE_DIR" -type f -name "*.dmg" -exec cp {} dist/ \;
          for artifact in $(find "$BUNDLE_DIR" -type f -name "*.app.tar.gz"); do
            cp "$artifact" "dist/NoteMeld_${GITHUB_REF_NAME#v}_aarch64.app.tar.gz"
            cp "$artifact.sig" "dist/NoteMeld_${GITHUB_REF_NAME#v}_aarch64.app.tar.gz.sig"
          done
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/*

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install x86_64 ffmpeg
        run: |
          cd /tmp
          curl -L https://evermeet.cx/ffmpeg/getrelease/zip -o ffmpeg.zip
          unzip -o ffmpeg.zip
          chmod +x ffmpeg
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip
          unzip -o ffprobe.zip
          chmod +x ffprobe
          mkdir -p /tmp/ffmpeg-x86
          mv ffmpeg ffprobe /tmp/ffmpeg-x86/
          ls -la /tmp/ffmpeg-x86/

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (x86_64)
        working-directory: desktop/backend
        run: |
          arch -x86_64 python3 -m venv .venv
          arch -x86_64 .venv/bin/python -m pip install --upgrade pip
          arch -x86_64 .venv/bin/python -m pip install -r requirements.txt

      - name: Build backend sidecar (x86_64)
        run: |
          arch -x86_64 bash -c '
            export NOTEMELD_SKIP_PORTABILITY_CHECK=1
            export NOTEMELD_PYTHON_BIN=desktop/backend/.venv/bin/python3
            export NOTEMELD_TARGET_ARCH=x86_64
            export FFMPEG_BIN_PATH=/tmp/ffmpeg-x86
            export ARCHFLAGS="-arch x86_64"
            export CFLAGS="-arch x86_64"
            export LDFLAGS="-arch x86_64"
            ./scripts/desktop/packaging/scripts/build-backend-macos.sh
          '

      - name: Build desktop app (x86_64) with signed updater artifact
        working-directory: desktop
        run: arch -x86_64 pnpm tauri build --target x86_64-apple-darwin --config src-tauri/tauri.release.conf.json

      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/x86_64-apple-darwin/release/bundle"
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR/dmg"/*.dmg dist/ 2>/dev/null || true
          fi
          find "$BUNDLE_DIR" -type f -name "*.dmg" -exec cp {} dist/ \;
          for artifact in $(find "$BUNDLE_DIR" -type f -name "*.app.tar.gz"); do
            cp "$artifact" "dist/NoteMeld_${GITHUB_REF_NAME#v}_x64.app.tar.gz"
            cp "$artifact.sig" "dist/NoteMeld_${GITHUB_REF_NAME#v}_x64.app.tar.gz.sig"
          done
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zipPath = "$env:TEMP\ffmpeg.zip"
          $extractPath = "$env:TEMP\ffmpeg-extract"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $ffmpegDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          $ffmpegBin = Join-Path $ffmpegDir.FullName "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegBin
          Write-Host "ffmpeg extracted to: $ffmpegBin"
          Test-Path (Join-Path $ffmpegBin "ffmpeg.exe")
          Test-Path (Join-Path $ffmpegBin "ffprobe.exe")

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: desktop/backend
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Build backend sidecar
        shell: pwsh
        env:
          NOTEMELD_PYTHON_BIN: desktop\backend\.venv\Scripts\python.exe
        run: |
          $ffmpegExe = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($ffmpegExe) {
            $env:FFMPEG_BIN_PATH = Split-Path $ffmpegExe.Source -Parent
            Write-Host "ffmpeg found in PATH at: $($env:FFMPEG_BIN_PATH)"
          } else {
            $ffmpegExe = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ffmpegExe) {
              $env:FFMPEG_BIN_PATH = $ffmpegExe.Directory.FullName
              $env:PATH = "$($ffmpegExe.Directory.FullName);$env:PATH"
              Write-Host "ffmpeg found at: $($env:FFMPEG_BIN_PATH)"
            } else {
              Write-Host "WARNING: ffmpeg not found"
            }
          }
          powershell -ExecutionPolicy Bypass -File .\scripts\desktop\packaging\scripts\build-backend-windows.ps1

      - name: Build desktop app with signed updater artifact
        working-directory: desktop
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Path dist -Force
          $bundleDir = "desktop\src-tauri\target\release\bundle"
          if (Test-Path "$bundleDir\msi") {
            Get-ChildItem -Path "$bundleDir\msi" -Filter "*.msi" -Recurse | Copy-Item -Destination dist\
          }
          Get-ChildItem -Path $bundleDir -File -Recurse | Where-Object { $_.Name -match '\.(msi|msi\.zip|msi\.zip\.sig|exe|exe\.sig)$' } | Copy-Item -Destination dist\
          Write-Host "Collected artifacts:"
          Get-ChildItem -Path dist\ | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  release:
    name: Create Release
    needs: [build-macos, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/macos-aarch64/* release/ 2>/dev/null || true
          cp artifacts/macos-x86_64/* release/ 2>/dev/null || true
          cp artifacts/windows-x86_64/* release/ 2>/dev/null || true
          python3 scripts/desktop/packaging/scripts/generate-latest-json.py \
            release "${GITHUB_REF_NAME#v}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/latest.json").read_text(encoding="utf-8"))
          required = {"darwin-aarch64", "darwin-x86_64", "windows-x86_64"}
          missing = sorted(required - set(manifest.get("platforms", {})))
          if missing:
              raise SystemExit(f"release manifest is missing required platforms: {', '.join(missing)}")
          print("validated updater platforms:", ", ".join(sorted(manifest["platforms"])))
          PY
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.msi
            release/*.exe
            release/*.app.tar.gz
            release/*.app.tar.gz.sig
            release/*.msi.zip
            release/*.msi.zip.sig
            release/latest.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

      - name: Verify public updater manifest and signed assets
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            "${RELEASE_BASE_URL}/latest.json" -o /tmp/notemeld-latest.json
          python3 - /tmp/notemeld-latest.json <<'PY'
          import json
          import sys
          from urllib.request import Request, urlopen

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          required = {"darwin-aarch64", "darwin-x86_64", "windows-x86_64"}
          platforms = manifest.get("platforms", {})
          missing = sorted(required - set(platforms))
          if missing:
              raise SystemExit(f"public updater manifest is missing: {', '.join(missing)}")
          for platform, entry in platforms.items():
              for key in ("url", "signature"):
                  if not entry.get(key):
                      raise SystemExit(f"{platform} updater entry has no {key}")
              request = Request(entry["url"], method="HEAD", headers={"User-Agent": "NoteMeld-release-check"})
              with urlopen(request, timeout=20) as response:
                  if response.status < 200 or response.status >= 400:
                      raise SystemExit(f"{platform} updater asset returned HTTP {response.status}")
          print("public updater manifest and assets verified")
          PY
