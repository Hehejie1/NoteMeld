name: Cloud backend

on:
  push:
    paths:
      - "cloud/**"
      - "backend/app/cloud_sync/**"
      - "backend/tests/test_cloud_*.py"
      - ".github/workflows/cloud-backend.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "backend/app/cloud_sync/**"
      - "backend/tests/test_cloud_*.py"
      - ".github/workflows/cloud-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: Install cloud dependencies
        run: python -m pip install -r cloud/requirements.txt pytest
      - name: Compile cloud and sync adapters
        run: PYTHONPATH=.:backend python -m compileall -q cloud backend/app/cloud_sync
      - name: Run cloud backend regression
        run: >-
          PYTHONPATH=.:backend python -m pytest
          backend/tests/test_cloud_crypto.py
          backend/tests/test_cloud_device_id.py
          backend/tests/test_cloud_agent.py
          backend/tests/test_cloud_backend_slice.py
          backend/tests/test_cloud_sync_protocol.py
          backend/tests/test_cloud_client.py -q
