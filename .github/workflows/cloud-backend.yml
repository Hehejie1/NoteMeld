name: Cloud backend

on:
  push:
    paths:
      - "cloud/**"
      - "backend/app/cloud_sync/**"
      - "backend/tests/test_cloud_*.py"
      - ".github/workflows/cloud-backend.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "backend/app/cloud_sync/**"
      - "backend/tests/test_cloud_*.py"
      - ".github/workflows/cloud-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: Install cloud dependencies
        run: python -m pip install -r cloud/requirements.txt pytest
      - name: Compile cloud and sync adapters
        run: PYTHONPATH=.:backend python -m compileall -q cloud backend/app/cloud_sync
      - name: Run cloud backend regression
        env:
          NOTEMELD_CLOUD_RELAY_TEST_URL: redis://127.0.0.1:6379/0
        run: PYTHONPATH=.:backend python -m pytest backend/tests/test_cloud_*.py -q
