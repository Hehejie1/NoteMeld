<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NoteMeld 人员管理</title>
    <link rel="stylesheet" href="../../assets/cloud.css" />
  </head>
  <body class="cloud-page cloud-workbench-page admin-role" data-page="C04">
    <div class="cloud-app">
      <aside class="cloud-sidebar">
        <div class="sidebar-brand">
          <span class="brand-symbol"
            ><img src="../../assets/logo.png" alt="NoteMeld" /></span
          ><span><strong>NoteMeld</strong><small>云端管理</small></span>
        </div>
        <nav class="cloud-nav">
          <a href="#" data-go="C02"
            ><i data-icon="messages-square"></i><span>AI 工作台</span></a
          ><a href="#" data-go="C05"
            ><i data-icon="monitor-smartphone"></i><span>设备管理</span></a
          ><a class="active" href="#" data-go="C04"
            ><i data-icon="users"></i><span>人员管理</span></a
          ><a href="#" data-go="C06"
            ><i data-icon="settings-2"></i><span>设置</span></a
          >
        </nav>
      </aside>
      <main class="cloud-main">
        <header class="workbench-header">
          <div>
            <span class="section-kicker">People</span>
            <h1>人员管理</h1>
          </div>
          <nm-button variant="primary" class="primary-button" type="button" data-invite-member>
            <i data-icon="mail-plus"></i>邀请成员
          </nm-button>
        </header>
        <section class="people-overview">
          <article>
            <span>待审核申请</span><strong>1</strong
            ><small>需要管理员处理</small>
          </article>
          <article>
            <span>有效成员</span><strong>28</strong
            ><small>包含管理员 3 人</small>
          </article>
          <article>
            <span>待激活邀请</span><strong>2</strong
            ><small>等待用户设置密码</small>
          </article>
        </section>
        <section class="people-panel">
          <header>
            <div class="scope-tabs">
              <nm-button variant="ghost" class="active" data-people-tab="requests">申请列表</nm-button
              ><nm-button variant="ghost" data-people-tab="members">已加入列表</nm-button>
            </div>
            <div class="people-tools">
              <label class="select-field"
                ><select>
                  <option>全部状态</option>
                  <option>待审核</option>
                  <option>已同意</option>
                  <option>已拒绝</option>
                </select></label
              >
              <div class="search-field people-search">
                <i data-icon="search"></i><input placeholder="搜索邮箱" />
              </div>
            </div>
          </header>
          <div class="people-table" data-people-panel="requests">
            <div class="people-head request-head">
              <span>申请人</span><span>申请说明</span><span>申请时间</span
              ><span>审核人 / 时间</span><span>状态</span><span>操作</span>
            </div>
            <article class="person-row request-row" data-request-row>
              <span class="person-identity"
                ><span class="avatar">林</span
                ><span
                  ><strong data-request-name>林一</strong
                  ><small data-request-email>linyi@example.com</small></span
                ></span
              ><span class="request-reason" data-request-reason
                >申请使用云端 Agent 整理产品研究资料。</span
              ><time>刚刚</time><span class="review-meta">—</span
              ><nm-badge tone="warning" class="status-badge approval"><i data-icon="clock-3"></i>待审核</nm-badge>
              <span class="person-actions"
                ><nm-button variant="secondary" class="secondary-button">拒绝</nm-button
                ><nm-button variant="primary" class="primary-button">同意</nm-button></span
              >
            </article>
          </div>
          <div class="people-table" data-people-panel="members" hidden>
            <div class="people-head member-head">
              <span>成员</span><span>角色 / 状态</span><span>加入方式</span
              ><span>加入 / 最近登录</span><span>最近设备</span
              ><span>操作</span>
            </div>
            <article class="person-row member-row">
              <span class="person-identity"
                ><span class="avatar">周</span
                ><span
                  ><strong>周然</strong><small>zhouran@example.com</small></span
                ></span
              ><span>普通用户 · 正常</span><span>申请加入</span
              ><span>2026-08-21 · 今天 09:42</span><span>MacBook Pro</span
              ><nm-button variant="secondary" class="secondary-button">管理</nm-button>
            </article>
          </div>
        </section>
      </main>
    </div>
    <script src="../../design-system/vendor/notemeld-ui/notemeld-ui.min.js"></script>
    <script>
    // 兼容（必须在 cloud.js 前执行）：cloud.js 用原生 button 标签选择器查找邀请按钮，
    // 这里提前创建一个原生代理按钮，cloud.js 会为它绑定打开邀请弹窗的逻辑。
    (()=>{
      const nmBtn=document.querySelector('[data-invite-member]');
      if(nmBtn&&nmBtn.tagName!=='BUTTON'){
        const proxy=document.createElement('button');
        proxy.type='button';
        proxy.textContent='邀请成员';
        proxy.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)';
        nmBtn.before(proxy);
      }
    })();
    </script>
    <script src="../../assets/vendor/lucide.js"></script>
    <script src="../../assets/page.js"></script>
    <script src="../../assets/cloud.js"></script>
    <script src="../../assets/c04-live.js"></script>
    <script>
    // 兼容（须在 cloud.js 之后的逻辑使用）：cloud.js 用原生 button 标签选择器绑事件/建邀请弹窗，转发到 nm-* 标签。
    (()=>{
      // 邀请成员按钮：cloud.js 已在初始化时给其缓存的按钮绑定点击，
      // 这里把该原生按钮的点击转由 nm-* 标签触发；点击 nm 按钮时转发。
      const invite=document.querySelector('[data-invite-member]');
      if(invite&&invite.tagName!=='BUTTON'){
        invite.addEventListener('nm:press',()=>{
          const orig=[...document.querySelectorAll('.workbench-header button')].find(b=>b.textContent.includes('邀请成员'));
          orig?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
        });
      }
      // cloud.js 的“同意/拒绝”通过 person-actions button 绑定
      document.querySelectorAll('.person-actions nm-button').forEach(nb=>{
        nb.addEventListener('nm:press',()=>{
          const row=nb.closest('.person-row');
          const approved=nb.textContent.includes('同意');
          if(window.confirm((approved?'同意':'拒绝')+'这条访问申请？')){
            const badge=row.querySelector('.status-badge');
            badge.textContent=approved?'已同意':'已拒绝';
            badge.classList.toggle('success',approved);
            nb.parentElement.hidden=true;
          }
        });
      });
      // 成员行“管理”按钮（原型态）
      const manage=document.querySelector('.member-row .secondary-button');
      manage?.addEventListener('nm:press',()=>{
        const row=manage.closest('.member-row');
        const role=prompt('设置成员角色（管理员 / 普通用户）',row.querySelectorAll('span')[1]?.textContent||'普通用户');
        if(role){row.querySelectorAll('span')[1].textContent=role+' · 正常'}
      });
    })();
    </script>
  </body>
</html>
