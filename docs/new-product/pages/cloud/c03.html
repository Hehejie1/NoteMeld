<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>云端会话 · NoteMeld</title>
    <link rel="stylesheet" href="../../assets/cloud.css" />
    <link rel="stylesheet" href="../../assets/c03-controls.css" />
  </head>
  <body
    class="cloud-page cloud-session-page"
    data-page="C03"
    data-new-session="false"
  >
    <div class="cloud-app">
      <aside class="cloud-sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark"
            ><img src="../../assets/logo.png" alt="NoteMeld" /></span
          ><span><strong>NoteMeld</strong><small>云端</small></span>
        </div>
        <nav class="cloud-nav" aria-label="云端导航">
          <a href="#" data-go="C02"
            ><i data-icon="layout-dashboard"></i><span>AI 工作台</span></a
          ><a class="active" href="#" data-go="C03"
            ><i data-icon="message-square-text"></i><span>云端会话</span></a
          ><a href="#" data-go="C05"
            ><i data-icon="monitor-smartphone"></i><span>设备管理</span></a
          ><a class="admin-only" href="#" data-go="C04"
            ><i data-icon="users"></i><span>人员管理</span></a
          ><a href="#" data-go="C06"
            ><i data-icon="settings-2"></i><span>设置</span></a
          >
        </nav>
        <div class="cloud-sidebar-foot">
          <span class="status-dot"></span>云端 Agent 在线
        </div>
      </aside>
      <main class="cloud-main cloud-session-main">
        <div class="workspace-shell">
          <aside class="cloud-conversation-list" aria-label="云端会话列表">
            <div class="conversation-list-head">
              <strong>会话</strong
              ><button
                class="icon-button"
                type="button"
                aria-label="新建会话"
              >
                <i data-icon="plus"></i>
              </button>
            </div>
            <label class="search-field conversation-search"
              ><i data-icon="search"></i
              ><input placeholder="搜索会话" aria-label="搜索会话"
            /></label>
            <div class="conversation-items" data-session-list>
              <button class="conversation-item active" type="button">
                <span class="conversation-status running"></span>
                <span
                  ><strong>整理本周研究报告</strong
                  ><small>running · cloud_native</small></span
                >
              </button>
              <button class="conversation-item" type="button">
                <span class="conversation-status approval"></span>
                <span
                  ><strong>审批新依赖升级方案</strong
                  ><small>approval · cloud_native</small></span
                >
              </button>
              <button class="conversation-item" type="button">
                <span class="conversation-status completed"></span>
                <span
                  ><strong>梳理上周会议 Wiki</strong
                  ><small>completed · cloud_native</small></span
                >
              </button>
            </div>
          </aside>

          <div class="session-red" data-session-red>
            <div class="session-top">
              <section
                class="session-thread"
                aria-label="云端会话消息"
                data-session-thread
              >
                <div class="conversation-frame">
                  <header class="conversation-header">
                    <h1 data-session-title>整理本周研究报告</h1>
                    <div class="header-actions">
                      <button
                        class="icon-button panel-toggle"
                        title="打开底部面板"
                        aria-label="打开底部面板"
                        data-panel-toggle="bottom"
                        aria-pressed="false"
                      >
                        <i data-icon="panel-bottom"></i></button
                      ><button
                        class="icon-button panel-toggle"
                        title="打开侧边面板"
                        aria-label="打开侧边面板"
                        data-panel-toggle="side"
                        aria-pressed="false"
                      >
                        <i data-icon="panel-right"></i>
                      </button>
                    </div>
                  </header>
                  <div class="conversation-scroll" data-session-scroll>
                    <div data-session-empty hidden></div>
                  </div>
                  <footer class="conversation-composer">
                    <div class="cloud-composer">
                      <div class="attachment-row"></div>
                      <textarea
                        aria-label="输入消息"
                        maxlength="4000"
                        placeholder="继续告诉 Agent 你要完成什么…"
                      ></textarea>
                      <div class="composer-toolbar">
                        <button
                          class="text-action"
                          title="添加文件"
                          data-attach-file
                        >
                          <i data-icon="plus"></i><span>添加</span></button
                        ><input
                          type="file"
                          data-file-input
                          multiple
                          hidden /><button
                          class="permission-button"
                          type="button"
                          title="默认权限：常规操作直接执行，高风险操作会请求审批"
                        >
                          <i data-icon="shield-check"></i><span>默认权限</span
                          ><i data-icon="chevron-down"></i></button
                        ><span class="toolbar-spacer"></span
                        ><button
                          class="model-button"
                          type="button"
                          data-no-model="true"
                          title="暂无可用模型，请先到设置中配置模型"
                        >
                          <i data-icon="sparkles"></i
                          ><span data-model-label>暂无模型</span
                          ><i data-icon="chevron-down"></i></button
                        ><button
                          class="send-button"
                          aria-label="发送"
                          disabled
                        >
                          <i data-icon="arrow-up"></i>
                        </button>
                      </div>
                    </div>
                  </footer>
                </div>
              </section>

              <div
                class="resize-handle vertical"
                data-resize="side"
                title="拖拽调整侧边区域宽度"
              ></div>
              <aside class="explorer panel" data-panel="side" aria-label="资源管理器">
                <div class="explorer-main">
                  <header class="explorer-head">
                    <strong>资源管理器</strong>
                    <button class="icon-button" title="更多操作" aria-label="更多操作" data-explorer-menu><i data-icon="ellipsis"></i></button>
                  </header>
                  <div class="explorer-search" data-explorer-search>
                    <i data-icon="search"></i
                    ><input type="search" placeholder="搜索文件" aria-label="搜索文件" data-explorer-search-input />
                  </div>
                  <div class="explorer-section">
                    <div class="file-tree" data-file-tree></div>
                  </div>
                </div>
              </aside>
            </div>

            <div
              class="resize-handle horizontal"
              data-resize="bottom"
              title="拖拽调整底部区域高度"
            ></div>
            <section class="bottom-panel panel" data-panel="bottom" aria-label="终端">
              <header class="terminal-tabs">
                <div class="terminal-tab active">
                  <i data-icon="terminal"></i><span>ssh</span
                  ><button
                    class="terminal-tab-close"
                    title="关闭终端标签"
                    aria-label="关闭终端标签"
                  >
                    <i data-icon="x"></i>
                  </button>
                </div>
                <button
                  class="terminal-add"
                  title="新建终端"
                  aria-label="新建终端"
                >
                  <i data-icon="plus"></i
                ></button>
                <span class="terminal-spacer"></span>
                <button
                  class="icon-button"
                  title="关闭底部面板"
                  aria-label="关闭底部面板"
                  data-panel-close="bottom"
                >
                  <i data-icon="x"></i>
                </button>
              </header>
              <div class="terminal-body" data-bottom-logs><div class="terminal-line"><span class="t-prompt-user">hehejie@hehejie</span><span class="t-colon">:</span><span class="t-path">~</span><span class="t-colon">$</span><span class="t-cursor"></span></div></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script src="../../assets/vendor/lucide.js"></script>
    <script src="../../assets/page.js"></script>
    <script src="../../assets/cloud.js"></script>
    <script src="../../assets/c03-live.js"></script>
    <script src="../../assets/c03-new-session.js"></script>
    <script src="../../assets/c03-send-fix.js"></script>
    <script src="../../assets/c03-controls.js"></script>
    <script src="../../assets/c03-panels.js"></script>
    <script src="../../assets/c03-explorer.js"></script>
    <script src="../../assets/c03-stream-live.js"></script>
    <script src="../../assets/c03-terminal-live.js"></script>
  </body>
</html>
