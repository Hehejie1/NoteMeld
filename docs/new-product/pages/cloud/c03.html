<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云端会话 · NoteMeld</title><link rel="stylesheet" href="../../assets/cloud.css"><link rel="stylesheet" href="../../assets/c03-controls.css"></head>
<body class="cloud-page cloud-session-page" data-page="C03" data-new-session="true">
  <div class="cloud-app">
    <aside class="cloud-sidebar"><div class="sidebar-brand"><span class="brand-mark"><img src="../../assets/logo.png" alt="NoteMeld"></span><span><strong>NoteMeld</strong><small>云端</small></span></div><nav class="cloud-nav" aria-label="云端导航"><a href="#" data-go="C02"><i data-icon="layout-dashboard"></i><span>AI 工作台</span></a><a class="active" href="#" data-go="C03"><i data-icon="message-square-text"></i><span>云端会话</span></a><a href="#" data-go="C05"><i data-icon="monitor-smartphone"></i><span>设备管理</span></a><a class="admin-only" href="#" data-go="C04"><i data-icon="users"></i><span>人员管理</span></a><a href="#" data-go="C06"><i data-icon="settings-2"></i><span>设置</span></a></nav><div class="cloud-sidebar-foot"><span class="status-dot"></span>云端 Agent 在线</div></aside>
    <main class="cloud-main cloud-session-main">
      <header class="cloud-session-header" aria-label="会话面板"><div class="header-actions"><button class="icon-button" title="打开底部面板" aria-label="打开底部面板" data-c03-bottom-panel><i data-icon="panel-bottom"></i></button><button class="icon-button" title="打开侧边面板" aria-label="打开侧边面板" data-c03-panel-toggle><i data-icon="panel-right"></i></button></div></header>
      <div class="session-layout">
        <aside class="cloud-conversation-list" aria-label="云端会话列表"><div class="conversation-list-head"><strong>会话</strong><button class="icon-button" type="button" aria-label="新建会话" data-go="C03"><i data-icon="plus"></i></button></div><label class="search-field conversation-search"><i data-icon="search"></i><input placeholder="搜索会话" aria-label="搜索会话"></label><div class="conversation-items" data-session-list><p class="empty-cloud-state">正在读取会话…</p></div></aside>
        <section class="session-thread" aria-label="云端会话消息" data-session-thread><div class="empty-cloud-state" data-session-empty>选择一个会话后，这里会显示真实消息、Agent 事件和执行状态。</div><div class="cloud-composer-wrap"><div class="workspace-chip"><i data-icon="folder"></i><strong data-workspace-name>default</strong><span>默认 Workspace</span><i data-icon="chevron-down"></i></div><div class="cloud-composer"><div class="attachment-row"></div><textarea aria-label="输入消息" maxlength="4000" placeholder="继续告诉 Agent 你要完成什么…"></textarea><div class="composer-toolbar"><button class="text-action" title="添加文件" data-attach-file><i data-icon="plus"></i><span>添加</span></button><input type="file" data-file-input multiple hidden><button class="permission-button"><i data-icon="shield-check"></i><span>默认权限</span><i data-icon="chevron-down"></i></button><span class="toolbar-spacer"></span><button class="model-button" data-no-model="true"><i data-icon="sparkles"></i><span>没有模型</span><i data-icon="chevron-down"></i></button><span class="count">0 / 4000</span><button class="send-button" aria-label="发送" disabled><i data-icon="arrow-up"></i></button></div></div></div></section>
        <aside class="session-summary" aria-label="会话摘要"><div class="summary-title"><h2>会话摘要</h2><button class="icon-button" title="关闭摘要" aria-label="关闭摘要" data-c03-summary-close><i data-icon="x"></i></button></div><section><h3>执行命令 <span data-command-count>0</span></h3><div data-command-summary class="empty-cloud-state">暂无命令</div></section><section><h3>审批 <span data-approval-count>0</span></h3><div data-approval-summary class="empty-cloud-state">暂无待审批操作</div></section><section><h3>事件 <span data-event-count>0</span></h3><div data-event-summary class="empty-cloud-state">暂无事件</div></section></aside>
      </div>
    </main>
  </div>
  <script src="../../assets/vendor/lucide.js"></script><script src="../../assets/page.js"></script><script src="../../assets/c03-layout-fix.js"></script><script src="../../assets/cloud.js"></script><script src="../../assets/c03-live.js"></script><script src="../../assets/c03-new-session.js"></script><script src="../../assets/c03-send-fix.js"></script><script src="../../assets/c03-controls.js"></script>
</body></html>
