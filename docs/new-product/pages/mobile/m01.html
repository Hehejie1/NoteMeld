<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NoteMeld · 移动端首页</title>
  <link rel="stylesheet" href="../../assets/mobile.css?v=20260914-1">
  <style>
    /* Web Components 与旧业务样式的最小桥接，保持原有外观与触控尺寸 */
    nm-icon-button.round-button{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 7px 20px #27364c12;color:#283447;}
    nm-icon-button.round-button:hover{background:#fff;color:#283447;}
    nm-icon-button.round-button .nm-icon-button__icon svg{width:20px;}
    .mobile-composer nm-icon-button{border:0;background:transparent;color:#3975ed;}
    .mobile-composer nm-icon-button.composer-plus{width:28px;height:28px;}
    .mobile-composer nm-icon-button.send{width:42px;height:42px;border-radius:50%;background:#3975ed;color:#fff;}
    .mobile-composer nm-icon-button.send:hover{background:#3975ed;color:#fff;}
    .mobile-composer nm-icon-button.send .nm-icon-button__icon svg{width:19px;height:19px;}
    .mobile-sheet nm-icon-button.sheet-close{width:32px;height:32px;border-radius:50%;background:#f1f4f8;color:#7f8b9d;}
  </style>
</head>
<body class="mobile-preview" data-page="M01">
  <div class="iphone-shell">
    <div class="iphone-island"></div>
    <main class="mobile-screen mobile-home">
      <header class="mobile-header"><nm-icon-button class="round-button" name="menu" label="打开菜单" data-menu></nm-icon-button><span></span><span></span></header>
      <section class="mobile-hero hero-minimal"><div class="hero-brand"><span class="hero-logo"><img src="../../assets/logo.png" alt="NoteMeld"></span><strong>NoteMeld</strong></div><p class="hero-slogan">让 Agent 把想法变成可交付的成果。</p></section>
      <section class="quick-actions"><button data-go="M02"><i data-icon="file-text"></i><span>文档处理</span></button><button data-go="M02"><i data-icon="presentation"></i><span>做演示</span></button><button data-go="M02"><i data-icon="layout-grid"></i><span>工作台</span></button><button><i data-icon="more-horizontal"></i><span>更多</span></button></section>
      <div class="mobile-composer" data-composer>
        <div class="composer-input-row"><nm-icon-button class="composer-plus" name="plus" label="添加文件、技能或插件" data-file-add></nm-icon-button><input placeholder="发消息，或按住说话" aria-label="消息内容"><nm-icon-button class="send" name="arrowUp" label="发送"></nm-icon-button></div>
        <div class="composer-tools" aria-label="会话设置"><button class="composer-permission" data-permission-toggle aria-pressed="false"><i data-icon="shield-check"></i><span data-permission-label>默认权限</span><i data-icon="chevron-down"></i></button><button class="composer-model" data-model-open><i data-icon="sparkles"></i><span data-model-label>Auto</span><i data-icon="chevron-down"></i></button></div>
      </div>
      <p class="ai-disclaimer">内容由 AI 生成，请核实重要信息</p>
    </main>
    <aside class="mobile-drawer" data-menu-panel hidden>
      <header><span class="drawer-logo"><span><img src="../../assets/logo.png" alt="NoteMeld"></span>NoteMeld</span><nm-icon-button name="x" label="关闭菜单" data-menu-close></nm-icon-button></header>
      <div class="work-tabs"><button class="active">本地工作</button><button>云端工作</button><button>远程电脑</button></div>
      <div class="drawer-title"><span>任务</span><button data-go="M02"><i data-icon="plus"></i>新建任务</button></div>
      <div class="drawer-tasks"><a data-go="M02">检查系统架构<small>刚刚 · 云端 Agent</small></a><a data-go="M02">整理研究报告<small>昨天 · 本地 Agent</small></a><a data-go="M02">云端项目规划<small>2 天前 · 等待审批</small></a><a data-go="M02">远程设备排查<small>上周 · MacBook Pro</small></a><a data-go="M02">产品分析与用户研究<small>8 月 21 日 · 已完成</small></a></div>
      <button class="drawer-close drawer-settings" data-go="M03"><i data-icon="settings"></i><span><strong>iPhone 15 Pro</strong><small>NoteMeld Mobile · v0.9.0</small></span></button>
    </aside>
    <div class="drawer-scrim" data-menu-close hidden></div>
    <div class="sheet-backdrop" data-sheet-backdrop hidden></div>
    <section class="mobile-sheet attachment-sheet" data-attachment-sheet hidden><div class="sheet-handle"></div><div class="sheet-heading"><div><span class="sheet-eyebrow">添加到任务</span><h2>选择内容</h2></div><nm-icon-button class="sheet-close" name="x" label="关闭" data-sheet-close></nm-icon-button></div><div class="attachment-actions"><button data-camera-open><i data-icon="camera"></i><span>拍照</span><small>调用系统相机</small></button><button data-gallery-open><i data-icon="images"></i><span>图片 / 视频</span><small>从相册选择</small></button><button data-files-open><i data-icon="file-up"></i><span>手机文件</span><small>打开文件管理</small></button></div><div class="capability-picker"><div class="capability-tabs"><button data-capability-tab="skills">技能</button><button data-capability-tab="plugins">插件</button><button data-capability-tab="apps">应用</button><button data-capability-tab="agents">智能体</button></div><div class="capability-library" data-capability-library hidden><label class="sheet-search"><i data-icon="search"></i><input data-capability-search placeholder="搜索名称或描述" aria-label="搜索能力"></label><div data-capability-list></div></div></div></section>
    <section class="mobile-sheet model-sheet" data-model-sheet hidden><div class="sheet-handle"></div><div class="sheet-heading"><div><span class="sheet-eyebrow">会话设置</span><h2>选择模型</h2></div><nm-icon-button class="sheet-close" name="x" label="关闭" data-sheet-close></nm-icon-button></div><button class="model-choice" data-model-choice="Auto"><i data-icon="sparkles"></i><span><strong>Auto</strong><small>按任务自动选择</small></span><span class="check">✓</span></button><button class="model-choice" data-model-choice="Hy4 preview"><i data-icon="zap"></i><span><strong>Hy4 preview</strong><small>适合复杂分析 · 0.00x</small></span></button><button class="model-choice" data-model-choice="Hy3"><i data-icon="zap"></i><span><strong>Hy3</strong><small>快速响应 · 0.05x</small></span></button><button class="model-choice" data-model-choice="GLM-5.3"><i data-icon="cpu"></i><span><strong>GLM-5.3</strong><small>通用模型 · 0.79x</small></span></button><button class="model-choice" data-model-choice="Kimi-K3"><i data-icon="box"></i><span><strong>Kimi-K3</strong><small>长上下文 · 1.62x</small></span></button></section>
    <section class="mobile-sheet permission-sheet" data-permission-sheet hidden><div class="sheet-handle"></div><div class="sheet-heading"><div><span class="sheet-eyebrow">会话设置</span><h2>操作权限</h2></div><nm-icon-button class="sheet-close" name="x" label="关闭" data-sheet-close></nm-icon-button></div><button class="permission-choice selected" data-permission-choice="default"><span class="permission-icon"><i data-icon="shield-check"></i></span><span><strong>默认权限</strong><small>执行敏感操作前先向你确认</small></span><span class="check">✓</span></button><button class="permission-choice" data-permission-choice="full"><span class="permission-icon warning"><i data-icon="zap"></i></span><span><strong>完全访问</strong><small>减少确认步骤，直接执行任务</small></span></button></section>
    <section class="mobile-modal" data-access-modal hidden><div class="modal-card"><span class="modal-icon"><i data-icon="shield-alert"></i></span><h2>开启完全访问？</h2><p>开启完全访问后，所有任务将减少确认步骤并直接操作您的手机，请谨慎操作。</p><div class="modal-actions"><button data-access-cancel>取消</button><button class="primary" data-access-confirm>继续开启</button></div></div></section>
    <input type="file" data-camera-input accept="image/*" capture="environment" hidden><input type="file" data-gallery-input accept="image/*,video/*" multiple hidden><input type="file" data-files-input multiple hidden>
  </div>
  <script src="../../assets/vendor/lucide.js"></script>
  <script src="../../design-system/vendor/notemeld-ui/notemeld-ui.min.js"></script>
  <script src="../../assets/mobile.js?v=20260914-1"></script>
</body>
</html>
