<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoteMeld PC</title>
  <style>
    :root{--bg:#f7f8fb;--surface:#fff;--surface2:#f0f2f7;--line:#e0e4ec;--text:#202533;--muted:#7b8497;--blue:#4b7cf3;--blue-weak:#e8efff;--agent:#f8f9fc}
    [data-theme=dark]{--bg:#111522;--surface:#171d2d;--surface2:#20283b;--line:#30394e;--text:#edf1fb;--muted:#9ba7bd;--blue:#8eafff;--blue-weak:#263858;--agent:#141a2a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"PingFang SC",sans-serif}.app{display:flex;height:100vh;overflow:hidden}
    button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}.sidebar{width:310px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
    .sidebar-top{padding:22px 20px 16px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:19px}.theme{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.theme:hover{color:var(--blue);background:var(--blue-weak)}
    .feature-blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:19px}.feature{padding:10px 5px;text-align:center;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px}.feature:first-child{color:var(--blue);background:var(--blue-weak);border-color:transparent}.feature .icon{display:block;font-size:18px;margin-bottom:3px}
    .directory{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 12px 0}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--muted)}.search input{border:0;outline:0;min-width:0;flex:1;background:transparent}.tabs{display:flex;gap:3px;margin:12px 0 8px;padding:3px;border-radius:9px;background:var(--surface2)}.tabs button{flex:1;padding:7px 3px;border-radius:7px;color:var(--muted)}.tabs button.active{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 2px 8px #24355d12}.page-list{min-height:0;overflow:auto}.section{margin:12px 6px 5px;color:var(--muted);font-size:11px;font-weight:700}.page{padding:10px 9px;border-radius:9px;margin:2px 0;cursor:pointer}.page:hover,.page.active{background:var(--blue-weak)}.page strong{font-size:13px}.page small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sidebar-bottom{border-top:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#28bd79}.settings{color:var(--muted);font-size:18px}
    .content{flex:1;min-width:0;display:flex;position:relative}.agent{flex:1;min-width:0;background:var(--agent);display:flex;flex-direction:column}.blank-top{height:68px;flex:none;border-bottom:1px solid transparent;display:flex;justify-content:flex-end;align-items:center;padding:0 18px}.extension-toggle{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);font-size:18px}.extension-toggle:hover{color:var(--blue);background:var(--blue-weak)}.agent-body{width:min(850px,calc(100% - 64px));margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0}.eyebrow{color:var(--blue);font-size:12px;font-weight:700}.agent h1{font-size:29px;margin:6px 0}.agent-intro{color:var(--muted);margin:0 0 28px}.msg{max-width:670px;margin:12px 0}.msg.user{align-self:flex-end}.msg-label{color:var(--muted);font-size:12px;margin-bottom:5px}.bubble{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.msg.user .bubble{background:var(--blue);border-color:var(--blue);color:#fff}.composer{margin-top:26px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:14px;box-shadow:0 10px 28px #26375d10}.composer textarea{display:block;width:100%;min-height:58px;resize:none;border:0;outline:0;background:transparent}.composer-footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.send{padding:8px 13px;border-radius:8px;background:var(--blue);color:#fff}
    .extension{width:360px;flex:none;background:var(--surface);border-left:1px solid var(--line);padding:24px 20px;overflow:auto}.extension h2{font-size:16px;margin:0 0 22px}.extension h3{font-size:14px;margin:22px 0 9px}.card{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--surface2)}.card h4{margin:0 0 6px;font-size:15px}.card p{color:var(--muted);margin:5px 0 11px}.line{height:8px;border-radius:4px;background:var(--line);margin:8px 0}.line.short{width:62%}.open{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
    .hidden{display:none!important}
    @media(max-width:900px){.sidebar{width:270px}.extension{width:300px}.agent-body{width:calc(100% - 40px)}}
  </style>
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top"><div class="brand-row"><div class="brand"><span class="logo">N</span><span>NoteMeld</span></div><button class="theme" id="theme" title="切换主题">☼</button></div><div class="feature-blocks"><button class="feature"><span class="icon">✦</span>技能</button><button class="feature"><span class="icon">♧</span>插件</button><button class="feature"><span class="icon">▦</span>应用</button><button class="feature"><span class="icon">♙</span>团队</button></div></div>
      <div class="directory"><label class="search">⌕ <input placeholder="搜索页面" /></label><div class="tabs"><button class="active">全部</button><button>桌面端</button><button>云端</button></div><div class="page-list" id="pageList"></div></div>
      <div class="sidebar-bottom"><div class="status"><span class="dot"></span><span>本地 Agent 已连接</span></div><button class="settings" title="设置">⚙</button></div>
    </aside>
    <main class="content"><section class="agent"><div class="blank-top"><button class="extension-toggle" id="extensionToggle" title="展开/收起扩展">◫</button></div><div class="agent-body"><div class="eyebrow" id="pageCode">D01 · Agent 默认首页</div><h1 id="pageTitle">Agent 默认首页</h1><p class="agent-intro" id="pageDesc">桌面端本地 Agent 对话与扩展工作台</p><div class="msg user"><div class="msg-label">你 · 10:42</div><div class="bubble">请帮我检查这份系统架构，并整理出可以继续推进的工作。</div></div><div class="msg"><div class="msg-label">NoteMeld Agent · 分析中</div><div class="bubble">我会先阅读当前工作区中的资料，再把结论、引用和生成的产物整理到右侧扩展区。<div class="line"></div><div class="line short"></div></div></div><div class="composer"><textarea placeholder="今天帮你做什么？可引用文件、调用能力或指令…"></textarea><div class="composer-footer"><span>＋ 添加文件　·　默认权限</span><button class="send">发送 ↑</button></div></div></div></section><aside class="extension" id="extension"><h2>Agent 与应用扩展</h2><h3>当前产物</h3><div class="card"><h4>系统架构研究报告.md</h4><p>Markdown · 本地文件 · 刚刚生成</p><div class="line"></div><div class="line"></div><div class="line short"></div><button class="open">打开文件</button></div><h3>应用扩展</h3><div class="card"><h4>Wiki 应用</h4><p>查看已编译知识、关联实体和来源图谱。</p><button class="open">打开应用</button></div></aside></main>
  </div>
  <script>
    const pages=[['桌面端 Agent',[['D01','Agent 默认首页','本地 Agent 对话与扩展工作台'],['D02','新建会话','选择本地、云端原生或远程设备会话'],['D03','会话详情','消息、工具、审批、队列、分支与收纳'],['D04','文件与产物','查看、编辑、引用和打开 Agent 生成的产物'],['D05','应用中心','打开已安装 Application 与关联能力'],['D06','插件与能力','管理插件、Skill、MCP 和设备能力'],['D07','远程设备','配对、授权、在线状态和活动记录'],['D08','设备连接授权','选择 workspace、权限、模型并建立连接'],['D09','设置','模型、账户、主题、数据和安全设置']]],['云端页面',[['C01','云端登录','普通用户和管理员共用登录入口'],['C02','云端会话工作台','云端原生 Agent 会话与 workspace 管理'],['C03','云端会话详情','消息、事件、产物、队列、审批和同步状态'],['C04','分享/导入本地会话','将本地会话复制为独立的云端新会话'],['C05','云端 Workspace','文件、产物、容量、备份和恢复状态'],['C06','设备与授权','设备、远程授权和撤销'],['C07','管理员管理','用户、角色、配额和审计，按权限显示']]]];let selected='0-0';
    const list=document.getElementById('pageList');function render(){list.innerHTML=pages.map((section,si)=>'<div class="section">'+section[0]+'</div>'+section[1].map((p,i)=>'<div class="page '+(selected===si+'-'+i?'active':'')+'" data-key="'+si+'-'+i+'"><strong>'+p[0]+'　'+p[1]+'</strong><small>'+p[2]+'</small></div>').join('')).join('');list.querySelectorAll('.page').forEach(el=>el.onclick=()=>{selected=el.dataset.key;const [si,i]=selected.split('-').map(Number),p=pages[si][1][i];document.getElementById('pageCode').textContent=p[0]+' · '+p[1];document.getElementById('pageTitle').textContent=p[1];document.getElementById('pageDesc').textContent=p[2];document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));el.classList.add('active')})}render();
    document.getElementById('theme').onclick=()=>document.body.dataset.theme=document.body.dataset.theme==='light'?'dark':'light';document.getElementById('extensionToggle').onclick=()=>document.getElementById('extension').classList.toggle('hidden');
  </script>
</body>
</html>
