      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);

    }

    .ui-bar p { margin: 0; font-size: 13px; color: #464556; line-height: 1.5; }
    .ui-bar .tag {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 8px;
