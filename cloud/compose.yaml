services:
  cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    ports:
      - "8583:8583"
    environment:
      NOTEMELD_CLOUD_ADMIN_USERNAME: ${NOTEMELD_CLOUD_ADMIN_USERNAME:?set admin username}
      NOTEMELD_CLOUD_ADMIN_PASSWORD: ${NOTEMELD_CLOUD_ADMIN_PASSWORD:?set admin password}
      NOTEMELD_CLOUD_MAX_WORKSPACE_BYTES: ${NOTEMELD_CLOUD_MAX_WORKSPACE_BYTES:-1000000000}
      NOTEMELD_CLOUD_MAX_WORKSPACE_FILES: ${NOTEMELD_CLOUD_MAX_WORKSPACE_FILES:-10000}
      NOTEMELD_CLOUD_MAX_REQUEST_BYTES: ${NOTEMELD_CLOUD_MAX_REQUEST_BYTES:-16777216}
      NOTEMELD_CLOUD_APPROVAL_TTL_SECONDS: ${NOTEMELD_CLOUD_APPROVAL_TTL_SECONDS:-900}
      NOTEMELD_CLOUD_CORS_ORIGINS: ${NOTEMELD_CLOUD_CORS_ORIGINS:-}
      NOTEMELD_CLOUD_REQUIRE_DEVICE_PROOF: ${NOTEMELD_CLOUD_REQUIRE_DEVICE_PROOF:-0}
      NOTEMELD_CLOUD_DEVICE_ONLINE_TTL_SECONDS: ${NOTEMELD_CLOUD_DEVICE_ONLINE_TTL_SECONDS:-90}
      NOTEMELD_CLOUD_COMMAND_WAIT_SECONDS: ${NOTEMELD_CLOUD_COMMAND_WAIT_SECONDS:-20}
      NOTEMELD_CLOUD_COMMAND_LEASE_SECONDS: ${NOTEMELD_CLOUD_COMMAND_LEASE_SECONDS:-300}
      NOTEMELD_CLOUD_SECRET_KEY: ${NOTEMELD_CLOUD_SECRET_KEY:-}
      NOTEMELD_CLOUD_AGENT_MAX_RETRIES: ${NOTEMELD_CLOUD_AGENT_MAX_RETRIES:-2}
      NOTEMELD_CLOUD_RELAY_MAX_FRAME_BYTES: ${NOTEMELD_CLOUD_RELAY_MAX_FRAME_BYTES:-262144}
      NOTEMELD_CLOUD_AGENT_BASE_URL: ${NOTEMELD_CLOUD_AGENT_BASE_URL:-}
      NOTEMELD_CLOUD_AGENT_MODEL: ${NOTEMELD_CLOUD_AGENT_MODEL:-cloud-agent}
      NOTEMELD_CLOUD_AGENT_API_KEY: ${NOTEMELD_CLOUD_AGENT_API_KEY:-}
      NOTEMELD_CLOUD_AGENT_TIMEOUT_SECONDS: ${NOTEMELD_CLOUD_AGENT_TIMEOUT_SECONDS:-120}
      NOTEMELD_CLOUD_RELAY_BACKEND: ${NOTEMELD_CLOUD_RELAY_BACKEND:-memory}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - notemeld-cloud-data:/var/lib/notemeld-cloud
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8583/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  notemeld-cloud-data:
