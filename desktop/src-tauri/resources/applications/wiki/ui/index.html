<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki</title>
    <style>
      :root { color: #1f2937; background: #f8fafc; font: 14px system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button { cursor: pointer; }
      .app { display: flex; min-height: 100vh; position: relative; overflow: hidden; }
      .canvas { flex: 1; min-width: 0; position: relative; background: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
      .toolbar { position: absolute; z-index: 2; top: 16px; left: 16px; display: flex; gap: 6px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 5px; box-shadow: 0 2px 8px #0f172a12; }
      .toolbar button { border: 0; border-radius: 5px; background: transparent; padding: 7px 10px; color: #64748b; }
      .toolbar button.active { color: white; background: #2563eb; }
      .actions { position: absolute; z-index: 2; top: 16px; right: 16px; display: flex; gap: 6px; }
      .actions button { border: 1px solid #e2e8f0; border-radius: 7px; background: white; padding: 8px 10px; color: #475569; }
      svg { width: 100%; height: 100%; min-height: 480px; }
      .edge { stroke: #94a3b8; stroke-width: 1.5; opacity: .7; }
      .node { stroke: white; stroke-width: 2; cursor: pointer; }
      .node-label { fill: #334155; font-size: 12px; pointer-events: none; }
      .side { width: 310px; flex: 0 0 310px; padding: 20px; background: white; border-left: 1px solid #e2e8f0; overflow: auto; }
      .muted { color: #64748b; line-height: 1.6; }
      .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-top: 12px; }
      .card button { width: 100%; border: 1px solid #cbd5e1; border-radius: 7px; background: white; padding: 8px; }
      .error { color: #b91c1c; }
      @media (max-width: 720px) { .app { display: block; } .side { width: auto; min-height: 220px; border-left: 0; border-top: 1px solid #e2e8f0; } }
    </style>
  </head>
  <body><main id="app" class="app"><section class="canvas"><div class="toolbar"><button data-mode="type" class="active">类型视图</button><button data-mode="community">社群视图</button></div><div class="actions"><button id="refresh">刷新</button></div><svg id="graph" viewBox="0 0 900 600" role="img" aria-label="Wiki 图谱"></svg></section><aside id="side" class="side"><h2>Wiki</h2><p class="muted">正在通过 Application Host 读取知识图谱…</p></aside></main><script src="./app.js"></script></body>
</html>
