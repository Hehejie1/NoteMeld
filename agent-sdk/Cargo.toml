[workspace]
members = [
    "crates/agent-capabilities",
    "crates/agent-approval",
    "crates/agent-core",
    "crates/agent-events",
    "crates/agent-ffi",
    "crates/agent-model",
    "crates/agent-session",
    "crates/agent-storage",
    "crates/agent-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
